apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webtop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jhonalca223-openclaw/openclaw-infra.git
    targetRevision: main
    path: k8s/webtop
  destination:
    server: https://kubernetes.default.svc
    namespace: webtop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
