apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kdvops-cli-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jhonalca223-openclaw/openclaw-infra.git
    targetRevision: main
    path: k8s/kdvops-isolated
  destination:
    server: https://kubernetes.default.svc
    namespace: kdvops-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
