apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-kdvops-config
  namespace: kdvops-system
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "auth": { "mode": "token" },
        "http": {
          "endpoints": {
            "chatCompletions": { "enabled": true }
          }
        }
      },
      "plugins": {
        "entries": {
          "codex": { "enabled": true }
        }
      },
      "agents": {
        "defaults": {
          "workspace": "/home/node/.openclaw/workspace",
          "model": { "primary": "openai/gpt-6.1-sol", "fallbacks": [] },
          "models": {
            "openai/gpt-6.1-sol": { "agentRuntime": { "id": "codex" } }
          },
          "timeoutSeconds": 300,
          "memorySearch": { "enabled": false },
          "sandbox": { "mode": "off" }
        },
        "list": [
          {
            "id": "kdvops",
            "name": "KDvops Isolated",
            "workspace": "/home/node/.openclaw/workspace",
            "agentDir": "/home/node/.openclaw/agents/kdvops/agent",
            "model": { "primary": "openai/gpt-6.1-sol", "fallbacks": [] },
            "tools": { "deny": ["*"] }
          }
        ]
      }
    }
  AGENTS.md: |
    # KDvops Isolated Agent

    You are a coding assistant behind a restricted broker. Use only the client-provided
    list_files, read_file, and write_file functions. Never request credentials or claim
    that a file changed unless the client tool confirms it. Keep proposed edits small and
    reviewable. Every tool path must be relative to the client's mounted workspace: use
    "." for its root and never send absolute paths or paths containing "..". You have no
    channels, host shell, cluster access, or administrative role.
