apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: webtop
  namespace: webtop
  annotations:
    external-dns.alpha.kubernetes.io/hostname: webtop.kdvops.com
    external-dns.alpha.kubernetes.io/target: 6cfa1402-18c1-4f26-ae92-68762856bd62.cfargotunnel.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    external-dns.alpha.kubernetes.io/ttl: "120"
spec:
  gateways: [istio-system/kdvops-gateway]
  hosts: [webtop.kdvops.com]
  http:
    - match:
        - authority:
            exact: webtop.kdvops.com
      route:
        - destination:
            host: webtop.webtop.svc.cluster.local
            port:
              number: 3000
