apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  labels:
    app: openclaw
  name: openclaw
  namespace: openclaw
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: openclaw
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app: openclaw
    spec:
      initContainers:
        - name: codex-install
          image: ghcr.io/openclaw/openclaw:2026.7.1-2-arm64
          imagePullPolicy: IfNotPresent
          env:
            - name: CODEX_HOME
              value: /tmp/codex-install
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p "$CODEX_HOME"
              if [ ! -x "$CODEX_HOME/packages/standalone/current/bin/codex" ]; then
                echo "[codex-install] Instalando Codex CLI 0.166.0 en un volumen temporal aislado..."
                command -v curl >/dev/null 2>&1
                curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 CODEX_HOME="$CODEX_HOME" TAR_OPTIONS=--no-same-owner sh -s -- --release 0.166.0
              fi
              test -x "$CODEX_HOME/packages/standalone/current/bin/codex"
              cp "$CODEX_HOME/packages/standalone/current/bin/codex" /shared/codex
              chmod 0555 /shared/codex
              echo "[codex-install] Codex CLI is available."
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: codex-runtime
              mountPath: /shared
            - name: codex-install-home
              mountPath: /tmp/codex-install

        - name: codex-auth-migrate
          image: ghcr.io/openclaw/openclaw:2026.7.1-2-arm64
          imagePullPolicy: IfNotPresent
          env:
            - name: CODEX_HOME
              value: /root/.openclaw/codex-home
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p "$CODEX_HOME"

              # Los candidatos se prueban en orden: backup propio del PVC y,
              # como ultimo recurso, el auth.json historico que vive dentro de
              # openclaw-data (hostPath persistente y fuera del PVC efimero).
              # El directorio legacy puede no existir: por eso no se exige.
              restore_from() {
                src="$1"
                [ -s "$src" ] || return 1
                tmp="$CODEX_HOME/.auth.json.seed.$$"
                cp "$src" "$tmp"
                chmod 0600 "$tmp"
                mv -f "$tmp" "$CODEX_HOME/auth.json"
                echo "[codex-auth-migrate] Seeded auth.json from $src"
                return 0
              }

              if [ ! -s "$CODEX_HOME/auth.json" ]; then
                restore_from "$CODEX_HOME/.auth-backup/auth.json" \
                  || restore_from /legacy-codex/auth.json \
                  || echo "[codex-auth-migrate] No seed available; waiting for codex-auth-supervisor."
              fi

              # Sembrar el backup del propio PVC para que el supervisor tenga
              # de donde restaurar sin depender del hostPath.
              if [ -s "$CODEX_HOME/auth.json" ]; then
                mkdir -p "$CODEX_HOME/.auth-backup"
                chmod 0700 "$CODEX_HOME/.auth-backup"
                if [ ! -s "$CODEX_HOME/.auth-backup/auth.json" ] \
                  || ! cmp -s "$CODEX_HOME/auth.json" "$CODEX_HOME/.auth-backup/auth.json"; then
                  cp "$CODEX_HOME/auth.json" "$CODEX_HOME/.auth-backup/auth.json.tmp"
                  chmod 0600 "$CODEX_HOME/.auth-backup/auth.json.tmp"
                  mv -f "$CODEX_HOME/.auth-backup/auth.json.tmp" "$CODEX_HOME/.auth-backup/auth.json"
                fi
              fi

              # No se aborta el arranque: el supervisor repara en caliente.
              # Solo se informa el estado para diagnostico.
              if [ -s "$CODEX_HOME/auth.json" ]; then
                echo "[codex-auth-migrate] auth.json present."
              else
                echo "[codex-auth-migrate] WARNING: auth.json absent after seeding." >&2
              fi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: openclaw-data
              mountPath: /root/.openclaw
            - name: legacy-codex-data
              mountPath: /legacy-codex
              readOnly: true

      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:2026.7.1-2-arm64
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              PATCH="/app/dist/plugin-sdk/fetch-runtime.js"

              if ! grep -q "resolveActiveManagedProxyTlsOptions" "$PATCH" 2>/dev/null; then
                echo "[startup] Parcheando plugin-sdk/fetch-runtime.js (add missing exports)..."
                cp "$PATCH" "${PATCH}.bak" 2>/dev/null || true
                sed -i "6i\import { n as createHttp1EnvHttpProxyAgent, r as createHttp1ProxyAgent, t as createHttp1Agent } from \"../undici-runtime-C_vBg_1o.js\";" "$PATCH"
                sed -i "8i\function resolveActiveManagedProxyTlsOptions(tlsOptions) { return {}; }" "$PATCH"
                sed -i "9s|export {|export { createHttp1Agent, createHttp1EnvHttpProxyAgent, createHttp1ProxyAgent, resolveActiveManagedProxyTlsOptions, |" "$PATCH"
                echo "[startup] Parche completo aplicado (3 cambios)."
              else
                echo "[startup] Parche ya presente, saltando."
              fi

              command -v codex >/dev/null 2>&1
              codex --version

              node openclaw.mjs config set 'agents.defaults.model.primary' 'codex/gpt-5.6-sol'
              node openclaw.mjs config set 'agents.list[0].model.primary' 'codex/gpt-5.6-sol'
              node openclaw.mjs config set 'plugins.entries.codex.config.appServer.homeScope' 'user'

              echo "[startup] Iniciando OpenClaw gateway..."
              exec node openclaw.mjs gateway --allow-unconfigured

          env:
            - name: GATEWAY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
                  optional: false
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: DEEPSEEK_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: RUNNER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: RUNNER_USERNAME
                  optional: false
            - name: RUNNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: RUNNER_PASSWORD
                  optional: false
            - name: PATH
              value: /opt/codex-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: CODEX_HOME
              value: /root/.openclaw/codex-home

          envFrom:
            - configMapRef:
                name: openclaw-config

          ports:
            - name: gateway
              containerPort: 18789
              protocol: TCP
            - name: browser
              containerPort: 18791
              protocol: TCP
            - name: app
              containerPort: 3000
              protocol: TCP

          readinessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 5

          livenessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5

          resources:
            requests:
              cpu: 400m
              memory: 256Mi
            limits:
              cpu: "4"
              memory: 5Gi

          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - DAC_OVERRIDE
                - CHOWN
                - FOWNER
                - SETUID
                - SETGID
              drop:
                - ALL

          volumeMounts:
            - name: codex-runtime
              mountPath: /opt/codex-bin
            - name: openclaw-data
              mountPath: /root/.openclaw
            - name: logs
              mountPath: /app/logs
            - name: ssh-keys
              mountPath: /root/.ssh
              readOnly: true
            - name: kubeconfig
              mountPath: /root/.kube
              readOnly: true
            - name: kubectl-binary
              mountPath: /usr/local/bin/kubectl
              readOnly: true

        - name: codex-auth-supervisor
          image: ghcr.io/openclaw/openclaw:2026.7.1-2-arm64
          imagePullPolicy: IfNotPresent
          env:
            - name: CODEX_HOME
              value: /root/.openclaw/codex-home
          command:
            - /bin/sh
            - -c
            - |
              set -u
              last_state=""
              initial="${SUPERVISOR_INITIAL_STATE:-}"
              backup_dir="$CODEX_HOME/.auth-backup"
              backup_file="$backup_dir/auth.json"

              # Estado inicial derivado de la perspectiva del init container.
              # Evita que un pod en carrera (maxSurge=1) borre el backup bueno
              # del PVC compartido por otro pod sano.
              case "$initial" in
                restored_from_legacy)
                  last_state="AUTH_SEEDED"
                  ;;
              esac

              mkdir -p "$backup_dir"
              chmod 0700 "$backup_dir"

              while true; do
                state=""
                detail=""

                if [ ! -s "$CODEX_HOME/auth.json" ]; then
                  if [ -s "$backup_file" ]; then
                    cp "$backup_file" "$CODEX_HOME/auth.json.tmp"
                    chmod 0600 "$CODEX_HOME/auth.json.tmp"
                    mv -f "$CODEX_HOME/auth.json.tmp" "$CODEX_HOME/auth.json"
                    state="AUTH_RESTORED"
                    detail="auth.json was restored atomically from the PVC backup"
                  else
                    state="AUTH_MISSING"
                    detail="auth.json and its PVC backup are absent"
                  fi
                else
                  login_status="$(/opt/codex-bin/codex login status 2>&1 || true)"
                  if printf '%s' "$login_status" | grep -q "Logged in"; then
                    if [ ! -s "$backup_file" ] || ! cmp -s "$CODEX_HOME/auth.json" "$backup_file"; then
                      cp "$CODEX_HOME/auth.json" "$backup_file.tmp"
                      chmod 0600 "$backup_file.tmp"
                      mv -f "$backup_file.tmp" "$backup_file"
                      state="AUTH_BACKUP_UPDATED"
                      detail="authenticated auth.json was copied atomically to the PVC backup"
                    else
                      state="AUTH_PRESENT"
                      detail="Codex reports a logged-in ChatGPT profile"
                    fi
                  else
                    # auth.json existe pero no valida: si hay backup bueno,
                    # se restaura para no dejar el pod sin credencial.
                    if [ -s "$backup_file" ] && ! cmp -s "$CODEX_HOME/auth.json" "$backup_file"; then
                      cp "$backup_file" "$CODEX_HOME/auth.json.tmp"
                      chmod 0600 "$CODEX_HOME/auth.json.tmp"
                      mv -f "$CODEX_HOME/auth.json.tmp" "$CODEX_HOME/auth.json"
                      state="AUTH_REPAIRED"
                      detail="invalid auth.json replaced by the PVC backup"
                    else
                      state="AUTH_INVALID_OR_UNAVAILABLE"
                      detail="codex login status did not report an authenticated profile"
                    fi
                  fi
                fi

                if [ "$state" != "$last_state" ]; then
                  echo "[codex-auth-supervisor] state=$state detail=$detail"
                  last_state="$state"
                fi

                sleep 60
              done
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: codex-runtime
              mountPath: /opt/codex-bin
              readOnly: true
            - name: openclaw-data
              mountPath: /root/.openclaw

      dnsPolicy: None

      dnsConfig:
        nameservers:
          - 10.43.0.10
          - 1.1.1.1
          - 8.8.8.8
        options:
          - name: ndots
            value: "5"
        searches:
          - openclaw.svc.cluster.local
          - svc.cluster.local
          - cluster.local

      nodeSelector:
        kubernetes.io/hostname: rasppi516

      volumes:
        - name: codex-runtime
          emptyDir: {}

        - name: codex-install-home
          emptyDir: {}

        - name: legacy-codex-data
          hostPath:
            path: /opt/openclaw/openclaw-data/codex-home
            type: DirectoryOrCreate

        - name: openclaw-data
          hostPath:
            path: /opt/openclaw/openclaw-data
            type: Directory

        - name: logs
          hostPath:
            path: /opt/openclaw/logs
            type: DirectoryOrCreate

        - name: ssh-keys
          secret:
            secretName: openclaw-ssh-keys
            defaultMode: 384

        - name: kubeconfig
          configMap:
            name: runner-kubeconfig
            defaultMode: 384

        - name: kubectl-binary
          hostPath:
            path: /usr/local/bin/kubectl
            type: File
